# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI/CD with Maven Ubuntu

on:
  push:
    branches: [ "main" ]
    paths:
      - 'pom.xml'
#  pull_request:
#    branches: [ "main" ]
#    paths:
#      - 'pom.xml'

jobs:
  build:

    runs-on: ubuntu-latest
    
    outputs:
      VERSION: ${{ env.VERSION }}

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
      
    - name: Build with Maven
      run: mvn -B package --file pom.xml
        
    - name: Set version
      id: set_version
      run: |
        version="$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)"
        echo "VERSION=$version" >> $GITHUB_ENV
        
    - name: Save artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "Ben-AI-Java-${{ env.VERSION }}"
        path: "target/Ben-AI-Java-${{ env.VERSION }}.jar"
        
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
  release:
  
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Get version
      id: get_version
      run: |
        echo "VERSION=${{ needs.build.outputs.VERSION }}" >> $GITHUB_ENV
      
    - name: Download Jar Artifact
      uses: actions/download-artifact@v4
      with:
        name: "Ben-AI-Java-${{ env.VERSION }}"
        
    - name: Upload Jar to Release
      id: upload-jar-to-release
      uses: ncipollo/release-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: "${{ env.VERSION }}"
        name: "${{ env.VERSION }}"
        body: |
            ${{ github.event.pull_request.body }}
            ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
        artifacts: "${{ github.workspace }}/Ben-AI-Java-${{ env.VERSION }}.jar"
        artifactContentType: application/java-archive

  deploy:
  
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Get version
      id: get_version
      run: |
        echo "VERSION=${{ needs.build.outputs.VERSION }}" >> $GITHUB_ENV
        
    - name: Deploy Jar to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_PRIVATE_KEY }}
        script: |
          mkdir -p /home/github/ben-ai-java
          cd /home/github/ben-ai-java
          
          # 1. Clean up old jars to save space
          rm -f *.jar
          
          # 2. Download the newly released jar
          wget https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/Ben-AI-Java-${{ env.VERSION }}.jar
          
          # 3. Rename to app.jar to match the Dockerfile
          mv Ben-AI-Java-${{ env.VERSION }}.jar app.jar
          
          # 4. Generate the Dockerfile automatically on the server
          cat << 'EOF' > Dockerfile
          FROM eclipse-temurin:21-jre
          WORKDIR /app
          COPY app.jar /app/app.jar
          ENV TZ=Asia/Hong_Kong
          RUN ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF
          
          # 5. Stop and remove the old container
          docker stop ben-ai-java || true
          docker rm ben-ai-java || true
          
          # 6. Build the new Docker image
          docker build -t ben-ai-java:latest .
          
          # 7. Run the new container
          docker run -d \
            --name ben-ai-java \
            --restart always \
            -p 127.0.0.1:8080:8080 \
            -v /home/github/ben-ai-java/.env:/app/.env \
            ben-ai-java:latest
            
          # 8. Clean up unused remote Docker images
          docker image prune -f
